[General]
; Used to support MySQL however these database tended to be small so SQLite is all that is needed.
db_type = SQLite
sqlite_location = mysqlitedb.db
temp_table_name = ojs_import_helper

; Conservative default: generate one issue per import XML file.
issues_per_file = 1

; URL where PDFs are located
; Reserved for remote galley support; embedded files are used by default.
pdf_url = http://127.0.0.1/

; Required fields for OJS. To be applied across all conversions
author_country = "CA"
locale = "en_US"

; For use when formatting dates via DateTime::createFromFormat()
dateFormat = "Y-m-d"

; Needed for use with custom genre, e.g. "Manuscript"
genreName = ""

; OJS 3.5 user imports require the journal's user-group definitions. Export
; users from the target journal and provide that XML file here or as the final
; CLI argument to a users/users:test command.
user_groups_file = ""

; Outputs info written to console to a file for reference
logLocation = "/tmp"
